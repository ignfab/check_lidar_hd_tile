name: LIDAR COPC Validation

on:
  workflow_dispatch:
    inputs:
      copc_url:
        description: 'URL to COPC.laz file'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Enforce only conda-forge channel
      run: |
        echo -e "channels:\n  - conda-forge\n  - nodefaults" > ~/.condarc

    - name: Verify COPC URL
      run: |
        if [[ ! "${{ github.event.inputs.copc_url }}" =~ \.copc\.laz$ ]]; then
          echo "Error: Provided URL does not end with .copc.laz"
          exit 1
        fi
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'
        environment-file: environment.yml
        activate-environment: lidar-env

    - name: Conda list
      shell: bash -el {0}
      run: conda list

    - name: Download COPC file
      run: |
        url="${{ github.event.inputs.copc_url }}"
        filename="${url##*/}"
        wget --quiet --retry-connrefused --waitretry=5 --timeout=30 --tries=5 "$url" -O "$filename"

    - name: Run validation script
      shell: bash -l {0}
      run: |
        python check_impulsions.py input.copc.laz

    - name: Find results archive and set filename var
      id: find_zip
      run: |
        ZIP_FILE=$(ls *_results.zip | head -n 1)
        echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
        # Extract the original COPC filename from the URL
        URL="${{ github.event.inputs.copc_url }}"
        FILENAME="${URL##*/}"
        BASENAME="${FILENAME%.copc.laz}"
        echo "copc_filename=$FILENAME" >> $GITHUB_OUTPUT
        echo "copc_basename=$BASENAME" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "lidar-validation-${{ steps.find_zip.outputs.copc_basename }}-$(date +'%Y%m%d%H%M%S')"
        name: "LIDAR Validation Results for ${{ steps.find_zip.outputs.copc_filename }} ($(date +'%Y-%m-%d %H:%M:%S'))"
        body: "Automated validation results archive for ${{ steps.find_zip.outputs.copc_filename }}."
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload results archive to release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.find_zip.outputs.zip_file }}
        tag_name: ${{ steps.create_release.outputs.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
