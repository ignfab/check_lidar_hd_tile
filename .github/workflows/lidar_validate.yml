name: LIDAR COPC Validation

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      copc_url:
        description: 'URL to COPC.laz file'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:

    - name: Generate date string
      id: date_gen
      run: |
        echo "date_str=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

    - name: Verify COPC URL
      run: |
        if [[ ! "${{ github.event.inputs.copc_url }}" =~ \.copc\.laz$ ]]; then
          echo "Error: Provided URL does not end with .copc.laz"
          exit 1
        fi

    - name: Extract COPC filename and basename
      id: copc_info
      run: |
        URL="${{ github.event.inputs.copc_url }}"
        FILENAME="${URL##*/}"
        BASENAME="${FILENAME%.copc.laz}"
        echo "copc_filename=$FILENAME" >> $GITHUB_OUTPUT
        echo "copc_basename=$BASENAME" >> $GITHUB_OUTPUT

    - name: Enforce only conda-forge channel
      run: |
        echo -e "channels:\n  - conda-forge\n  - nodefaults" > condarc
      shell: bash

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'
        environment-file: environment.yml
        activate-environment: lidar-env
      env:
        CONDARC: ${{ github.workspace }}/condarc

    - name: Download COPC file
      run: |
        url="${{ github.event.inputs.copc_url }}"
        filename="${{ steps.copc_info.outputs.copc_filename }}"
        wget --quiet --retry-connrefused --waitretry=5 --timeout=30 --tries=5 "$url" -O "$filename"

    - name: Run validation script
      shell: bash -l {0}
      run: |
        python check_impulsions.py "${{ steps.copc_info.outputs.copc_filename }}"

    - name: Find results archive
      id: find_zip
      run: |
        ZIP_FILE=$(ls *_results.zip | head -n 1)
        echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "lidar-validation-${{ steps.copc_info.outputs.copc_basename }}-${{ steps.date_gen.outputs.date_str }}"
        name: "LIDAR Validation Results for ${{ steps.copc_info.outputs.copc_filename }} (${{ steps.date_gen.outputs.date_str }})"
        body: "Automated validation results archive for ${{ steps.copc_info.outputs.copc_filename }}."
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload results archive to release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.find_zip.outputs.zip_file }}
        tag_name: ${{ steps.create_release.outputs.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
